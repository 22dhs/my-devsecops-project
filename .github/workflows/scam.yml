name: Laptop Security Scan

on: [push]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      # We are upgrading to Checkov, the top cloud security tool!
      - name: Run Cloud Infrastructure Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          soft_fail: true # This keeps our conveyor belt green while showing warnings!
          
# DEVSECOPS UPGRADE: Run our custom-built python tool in the cloud!
      - name: Run Custom Python Secret Sniffer
        run: |
          python sniffer.py